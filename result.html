<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
  <title>おみくじ結果</title>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>
</head>

<body class="result">


  <div class="top_deco">
    <div class="decoration">

      <p class="deco_1">
        <img src="./images/top/deco_1.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_2">
        <img src="./images/top/deco_2.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_3">
        <img src="./images/top/deco_3.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_4">
        <img src="./images/top/deco_4.svg" alt="背景飾り付け雲">
      </p>

      <p class="deco_flower1">
        <img src="./images/top/deco_flower1.svg" alt="背景飾り付け花">
      </p>
      <p class="deco_flower2">
        <img src="./images/top/deco_flower2.svg" alt="背景飾り付け花">
      </p>

    </div>
  </div>


  <div class="result_box">

    <div class="result_flex">

      <div class="result_txt">

        <p class="result_history">
          <img src="./images/result/arrow.svg" alt="" class="btn_arrow">
          <a href="history.html">履歴を見る</a>
        </p>

        <p class="result_top">
          <img src="./images/result/arrow.svg" alt="" class="btn_arrow">
          <a href="index.html">もう一度引く</a>
        </p>

      </div>

      <div class="result_set">
        <div id="lucky-wrapper">
          <p>縁起物:</p>
          <p id="lucky-item"></p>
        </div>

        <div class="js-result-img-wrapper">
          <img id="result-img" src="" alt="結果画像">
        </div>
      </div>

    </div>

  </div>

</body>

</html>
