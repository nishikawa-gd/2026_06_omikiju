<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>おみくじアプリ</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/result_3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;300;400;500;700;900&display=swap"
        rel="stylesheet">

</head>




<body class="result_3">
    <div class="result_main_visual">
        <p class="num">図鑑番号 007</p>
        <h1 class="name">ゼニガメ</h1>
        <a href="./history.html" class="btn_history">
            <div class="btn_history_flex">
                <p class="btn_txt_red">履歴</p>
                <p class="btn_boll_red"><img src="./images/top/btn_ball_red.svg" alt="モンスターボール"></p>
            </div>
        </a>
        <h2 class="type">タイプ</h2>
        <p class="type_contents">みず</p>
        <p class="result_txt">
            生まれた瞬間には甲羅は柔らかいが、空気に触れることで徐々に硬い甲羅が形成される。危険を察知すると甲羅に手足を引っ込めて防御態勢をとる。甲羅の役目は守るだけにあらず。表面の丸みを帯びた形と溝により、水中での水の抵抗を減らし、より速いスピードで泳ぐことができるのだ。
        </p>
        <h2 class="item">ラッキーアイテム</h2>
        <p class="item_txt">しんぴのしずく</p>
        <p class="result_main"><img src="./images/result/sesult_zenigame.png" alt="ゼニガメ"></p>
        <div class="btn_side">
            <a href="./index.html" class="go_top_btn">
                <div class="btn_flex">
                    <p class="btn_txt_white">トップに戻る</p>
                    <p class="btn_boll_wihte"><img src="./images/top/btn_ball_white.svg" alt="モンスターボール"></p>
                </div>
            </a>
            <a href="./play.html" class="play_btn">
                <div class="btn_flex">
                    <p class="btn_txt_white">もう一度回す</p>
                    <p class="btn_boll_wihte"><img src="./images/top/btn_ball_white.svg" alt="モンスターボール"></p>
                </div>
            </a>
        </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/function.js"></script>

</body>

</html>
