<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- 💡 忘れずに他のページと同じリセットCSSとスタイルCSSを読み込みます -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>

  <!-- 過去の運勢カードが並ぶエリア -->

    -->
  </ul>

  <!-- 💡 ボタンたちを1つのエリアにまとめます -->

    <p><a href="index.html" class="btn01">トップに戻る</a></p>
    <p><button id="clear-history">履歴を削除する</button></p>
  </div>
