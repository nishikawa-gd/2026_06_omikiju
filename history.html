<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/style.css">
  <title>おみくじ</title>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>
</head>

<body class="history">

  <div class="top_deco">
    <div class="decoration">

      <p class="deco_1">
        <img src="./images/top/deco_1.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_2">
        <img src="./images/top/deco_2.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_3">
        <img src="./images/top/deco_3.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_4">
        <img src="./images/top/deco_4.svg" alt="背景飾り付け雲">
      </p>

      <p class="deco_flower1">
        <img src="./images/top/deco_flower1.svg" alt="背景飾り付け花">
      </p>
      <p class="deco_flower2">
        <img src="./images/top/deco_flower2.svg" alt="背景飾り付け花">
      </p>

    </div>
  </div>


  <div class="history_box">

    <ul id="history-list"></ul>

    <div class="history_btn">

      <p><button id="clear-history">履歴を削除</button></p>

      <p class="history_back">
        <img src="./images/history/arrow2.svg" alt="" class="btn_arrow2">
        <a href="index.html">トップに戻る</a>
      </p>

    </div>

  </div>

</html>
