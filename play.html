<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>おみくじ演出</title>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="play">
  <div class="inner">
    <img class="logo" src="images/top_logo.png" alt="星降るオミクジ">
    <div class="solar_system">
      <div class="center_planet"><img src="images/play/planet.png" alt="中心の惑星"></div>

      <img src="images/result/result_mercury.png" class="orbit_planet mercury">
      <img src="images/result/result_venus.png" class="orbit_planet venus">
      <img src="images/result/result_earth.png" class="orbit_planet earth">
      <img src="images/result/result_mars.png" class="orbit_planet mars">
      <img src="images/result/result_jupiter.png" class="orbit_planet jupiter">
      <img src="images/result/result_saturn.png" class="orbit_planet saturn">
      <img src="images/result/result_uranus.png" class="orbit_planet uranus">
      <img src="images/result/result_neptune.png" class="orbit_planet neptune">
    </div>

    <p><a href="#" id="show-result">結果を見る</a></p>
  </div>
</body>

</html>
