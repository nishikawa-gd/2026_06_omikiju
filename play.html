<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/play.css">
  <title>おみくじ演出</title>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>
</head>

<body class="play">

  <div class="top_deco">
    <div class="decoration">

      <p class="deco_1">
        <img src="./images/top/deco_1.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_2">
        <img src="./images/top/deco_2.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_3">
        <img src="./images/top/deco_3.svg" alt="背景飾り付け雲">
      </p>
      <p class="deco_4">
        <img src="./images/top/deco_4.svg" alt="背景飾り付け雲">
      </p>

      <p class="deco_flower1">
        <img src="./images/top/deco_flower1.svg" alt="背景飾り付け花">
      </p>
      <p class="deco_flower2">
        <img src="./images/top/deco_flower2.svg" alt="背景飾り付け花">
      </p>

    </div>
  </div>

  <div class="play">
    <div class="play_box">

      <p class="play_txt">
        <a href="#" id="show-result">結果を見る</a>
      </p>
      <div class="omikuji_img">
        <img src="images/play/play_omikuji.svg" alt="おみくじを振る演出">
      </div>

    </div>
  </div>
</body>

</html>
