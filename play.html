<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>おみくじ演出</title>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/function.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="play">

  <div class="bg bg1"></div>
  <div class="bg bg2"></div>
  <div class="bg bg3"></div>

  <div class="content">
    <!-- 左下 -->
    <a href="#" class="planet venus" data-planet="venus">
      <img src="images/play/venus.png" alt="金星">
    </a>

    <!-- 左上 -->
    <a href="#" class="planet jupiter" data-planet="jupiter">
      <img src="images/play/jupiter.png" alt="木星">
    </a>

    <!-- 真ん中 -->
    <a href="#" class="planet earth" data-planet="earth">
      <img src="images/play/earth.png" alt="地球">
    </a>

    <!-- 右上 -->
    <a href="#" class="planet neptune" data-planet="neptune">
      <img src="images/play/neptune.png" alt="海王星">
    </a>

    <!-- 右下 -->
    <a href="#" class="planet sun" data-planet="sun">
      <img src="images/play/solor.png" alt="太陽">
    </a>

    <p class="message">
      気になる星を選んでみよう！
    </p>
  </div>


</body>
