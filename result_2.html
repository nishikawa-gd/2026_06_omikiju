<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>おみくじアプリ</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/result_2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/function.js"></script>
</head>




<body class="result_2">
    <div class="result_main_visual">
        <p class="num">図鑑番号 001</p>
        <h1 class="name">フシギダネ</h1>
        <a href="./history.html" class="btn_history">
            <div class="btn_history_flex">
                <p class="btn_txt_red">履歴</p>
                <p class="btn_boll_red"><img src="./images/top/btn_ball_red.svg" alt="モンスターボール"></p>
            </div>
        </a>
        <h2 class="type">タイプ</h2>
        <p class="type_contents">くさ</p>
        <p class="type_contents_2">どく</p>
        <p class="result_txt">
            生まれた時から背中に不思議なタネを持つポケモン。タネには栄養素が多く詰まっており、生まれてからしばらくはタネから栄養を補給する。栄養素のおかげで数日間食事をしなくても生きていけるタフさがある。また、成長に伴いタネも一緒に大きく育っていく。
        </p>
        <h2 class="item">ラッキーアイテム</h2>
        <p class="item_txt">キセキのタネ</p>
        <p class="result_main"><img src="./images/result/result_husigidane.png" alt="フシギダネ"></p>
        <div class="btn_side">
            <a href="./index.html" class="go_top_btn">
                <div class="btn_flex">
                    <p class="btn_txt_white">トップに戻る</p>
                    <p class="btn_boll_wihte"><img src="./images/top/btn_ball_white.svg" alt="モンスターボール"></p>
                </div>
            </a>
            <a href="./play.html" class="play_btn">
                <div class="btn_flex">
                    <p class="btn_txt_white">もう一度回す</p>
                    <p class="btn_boll_wihte"><img src="./images/top/btn_ball_white.svg" alt="モンスターボール"></p>
                </div>
            </a>
        </div>
    </div>

</body>


</html>
